name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  backend:
    name: Build & test API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore DocumentManagementSystem.sln
      - name: Build
        run: dotnet build DocumentManagementSystem.sln --no-restore --configuration Release
      - name: Test
        run: dotnet test DocumentManagementSystem.sln --no-build --configuration Release --collect:"XPlat Code Coverage" --settings coverlet.runsettings

  frontend:
    name: Build & test frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm test

  sprint4-integration:
    name: Sprint 4 Docker integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: dms-ci
      COMPOSE_FILE: docker-compose.yml:docker-compose.test.yml
      API_URL: http://localhost:18080/api
      KEYCLOAK_URL: http://localhost:18180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build and start isolated system
        run: docker compose up --build --wait --wait-timeout 240
      - name: Install native OCR test dependencies
        run: sudo apt-get update && sudo apt-get install -y ghostscript tesseract-ocr tesseract-ocr-eng
      - name: Real service integration tests
        env:
          DMS_INTEGRATION_TESTS: "true"
        run: dotnet test DocumentManagementSystem.sln --configuration Release --filter Category=Integration
      - name: Upload, OCR, indexing and search smoke test
        run: bash scripts/sprint4-smoke-test.sh
      - name: Bounded retries against a real worker
        run: python3 scripts/sprint4-retry-test.py
      - name: Restart and verify persisted services
        run: |
          python3 scripts/sprint4-persistence-test.py --recreate
          bash scripts/sprint4-smoke-test.sh
      - name: Diagnostics
        if: failure()
        run: docker compose logs --no-color --tail 150
      - name: Stop isolated system
        if: always()
        run: docker compose down --volumes
