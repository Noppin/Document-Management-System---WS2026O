name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  backend:
    name: Build & test API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore DocumentManagementSystem.sln
      - name: Build
        run: dotnet build DocumentManagementSystem.sln --no-restore --configuration Release
      - name: Test
        run: dotnet test DocumentManagementSystem.sln --no-build --configuration Release --collect:"XPlat Code Coverage" --settings coverlet.runsettings

  frontend:
    name: Build & test frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
